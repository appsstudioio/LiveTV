# GitHub 자동 릴리즈 노트 분류 설정
# 릴리즈 노트는 이전 태그 이후에 머지된 PR을 라벨별로 묶어 만든다.
# PR 라벨은 auto-pr.yml이 브랜치 이름으로 자동으로 붙인다(feature/ → enhancement, fix/·hotfix/ → bug).
changelog:
  exclude:
    labels:
      # develop → main 릴리즈 PR은 안에 든 기능 PR과 겹치므로 노트에서 뺀다.
      - release
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: 새 기능
      labels:
        - enhancement
        - feature
    - title: 버그 수정
      labels:
        - bug
        - fix
    - title: 문서
      labels:
        - documentation
    - title: 기타 변경
      labels:
        - "*"
