# 릴리즈 노트 자동 작성
# CHANGELOG.md에서 같은 버전의 섹션(## [1.1.0] - 날짜)을 찾아 GitHub 릴리즈 노트로 쓴다.
# - 버전 태그(예: 1.1.0)를 push하면 그 태그로 릴리즈를 만든다.
# - Actions 탭에서 직접 실행하면 Release.xcconfig의 MARKETING_VERSION(또는 입력한 버전)으로 태그와 릴리즈를 함께 만든다.
# CHANGELOG.md에 해당 버전 섹션이 없거나 비어 있으면 릴리즈를 만들지 않고 실패한다.
name: 릴리즈 노트 생성

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈 버전 (비우면 Release.xcconfig의 MARKETING_VERSION)'
        required: false
        type: string
      target:
        description: '태그를 만들 브랜치'
        required: false
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4
        with:
          # 이전 태그를 찾아야 하므로 전체 이력과 태그를 받는다.
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref }}

      - name: 버전 결정
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            XCCONFIG_VERSION="$(sed -nE 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*([0-9.]+).*/\1/p' LiveTV/Configurations/xcconfig/Release.xcconfig | sed -n '1p')"
            TAG="${INPUT_VERSION:-$XCCONFIG_VERSION}"
          fi

          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::버전 형식이 올바르지 않습니다: '$TAG' (예: 1.1.0)"
            exit 1
          fi

          # 버전 순으로 정렬해 이번 태그 바로 앞의 태그를 찾는다. 노트 끝의 "전체 변경 내역" 링크에 쓴다.
          PREVIOUS_TAG="$( { git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; echo "$TAG"; } \
            | sort -uV | awk -v t="$TAG" '$0 == t { print p; exit } { p = $0 }')"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "이번 태그: $TAG / 이전 태그: ${PREVIOUS_TAG:-없음}"

      - name: CHANGELOG에서 릴리즈 노트 추출
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md 파일이 없습니다."
            exit 1
          fi

          # "## [버전]" 줄부터 다음 "## [" 줄 전까지를 꺼낸다. 앞뒤 빈 줄은 지운다.
          awk -v ver="$TAG" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' | sed '/./,$!d' > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md에 '## [$TAG]' 섹션이 없거나 내용이 비어 있습니다. 먼저 CHANGELOG.md를 작성해 main에 반영하세요."
            exit 1
          fi

          if [ -n "$PREVIOUS_TAG" ]; then
            {
              echo ""
              echo "**전체 변경 내역**: https://github.com/$REPOSITORY/compare/$PREVIOUS_TAG...$TAG"
            } >> release_notes.md
          fi

          echo "----- 릴리즈 노트 -----"
          cat release_notes.md

      - name: 릴리즈 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "릴리즈 $TAG 가 이미 있어 건너뜁니다. 노트를 다시 쓰려면 릴리즈를 지우고 다시 실행하세요."
            exit 0
          fi

          # 태그가 없으면(직접 실행) gh가 target 커밋에 태그를 만든다.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md \
            --latest \
            --target "$(git rev-parse HEAD)"
          echo "### 릴리즈 $TAG 생성 완료" >> "$GITHUB_STEP_SUMMARY"
          cat release_notes.md >> "$GITHUB_STEP_SUMMARY"
